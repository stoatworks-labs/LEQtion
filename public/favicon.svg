<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="180" fill="#0e1116"/>
  <!-- Level bars rising left to right: the RTA. -->
  <g fill="#2f9ee0">
    <rect x="150" y="620" width="86" height="256" rx="24"/>
    <rect x="272" y="500" width="86" height="376" rx="24"/>
    <rect x="394" y="330" width="86" height="546" rx="24"/>
    <rect x="516" y="440" width="86" height="436" rx="24" opacity=".8"/>
    <rect x="638" y="560" width="86" height="316" rx="24" opacity=".65"/>
    <rect x="760" y="660" width="86" height="216" rx="24" opacity=".5"/>
  </g>
  <!-- Peak-hold caps, the thing that separates a meter from a bar chart. -->
  <g fill="#e8f4fd">
    <rect x="150" y="566" width="86" height="20" rx="10"/>
    <rect x="272" y="430" width="86" height="20" rx="10"/>
    <rect x="394" y="262" width="86" height="20" rx="10"/>
    <rect x="516" y="372" width="86" height="20" rx="10" opacity=".8"/>
    <rect x="638" y="492" width="86" height="20" rx="10" opacity=".65"/>
    <rect x="760" y="596" width="86" height="20" rx="10" opacity=".5"/>
  </g>
</svg>
