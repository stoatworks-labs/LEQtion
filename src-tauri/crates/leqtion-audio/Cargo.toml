[package]
name = "leqtion-audio"
description = "Audio capture for LEQtion: host and device enumeration, and a real-time-safe path from the driver callback to the analysis thread"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# The signal generator, so a measurement can be run against a known level with
# no device at all — see `synthetic`. Pure DSP: no I/O, nothing circular.
leqtion-dsp = { path = "../leqtion-dsp" }
cpal = "0.18"
# Lock-free SPSC ring. The audio callback must not allocate, block or take a
# lock, so it cannot touch the engine directly — it pushes here instead.
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

# Configuring the AVAudioSession before capture. iOS refuses to open an input
# until a record-capable category is active, and cpal does not set one. See
# session.rs. Pinned to the same objc2-avf-audio major that cpal itself uses,
# so both see one version of the framework bindings.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

[features]
# Windows ASIO. Off by default because it cannot be built without the Steinberg
# SDK, which is not redistributable — see docs/asio.md.
asio = ["cpal/asio"]
