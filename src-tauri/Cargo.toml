[package]
name = "leqtion"
version = "0.1.1"
description = "Sound level meter and real-time analyser: RTA, spectrograph, SPL and user-defined LEQ"
authors = ["Allan Sargeant"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix looks redundant and is not: on Windows the lib and bin names
# must differ. https://github.com/rust-lang/cargo/issues/8519
name = "leqtion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/diag", "crates/leqtion-dsp", "crates/leqtion-audio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
diag = { path = "crates/diag" }
leqtion-dsp = { path = "crates/leqtion-dsp" }
leqtion-audio = { path = "crates/leqtion-audio" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rtrb = "0.3"
time = { version = "0.3", features = ["formatting"] }

[features]
# Pass through to leqtion-audio. Build with `--features asio` on Windows once the
# Steinberg SDK is in place — see docs/asio.md.
asio = ["leqtion-audio/asio"]

[profile.release]
# The analysis thread runs a 65536-point transform several times a second; the
# difference between opt-level 2 and 3 here is measurable.
opt-level = 3
lto = true
